<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Employee Management Portal</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="auth-page">

<div class="container">

    <div class="row justify-content-center align-items-center vh-100">

        <!-- Left Side -->
        <div class="col-lg-6 d-none d-lg-block text-center text-white">

            <i class="bi bi-people-fill display-1"></i>

            <h1 class="fw-bold mt-4">
                Employee Management Portal
            </h1>

            <p class="lead mt-3">
                Manage employees, departments and records securely from one place.
            </p>

        </div>

        <!-- Right Side -->
        <div class="col-lg-5">

            <div class="login-box">

                <div class="text-center mb-4">

                    <i class="bi bi-person-circle display-4"></i>

                    <h2 class="mt-3">
                        Welcome Back
                    </h2>

                    <p>
                        Sign in to continue
                    </p>

                </div>

                {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
                {% endif %}

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-person"></i>
                            </span>

                            <input
                                type="text"
                                name="username"
                                class="form-control"
                                placeholder="Enter Username"
                                required>

                        </div>

                    </div>

                    <div class="mb-4">

                        <label class="form-label">
                            Password
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-lock"></i>
                            </span>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                placeholder="Enter Password"
                                required>

                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary w-100">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Login

                    </button>

                </form>

                <hr class="text-white">

                <div class="text-center">

                    <p class="mb-2">
                        Don't have an account?
                    </p>

                    <a href="/register" class="btn btn-outline-light">

                        <i class="bi bi-person-plus"></i>

                        Register

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>

{% extends "base.html" %}

{% block title %}Edit Employee{% endblock %}

{% block content %}

<h2 class="mb-4">Edit Employee</h2>

<form method="POST">

    <div class="mb-3">
        <label class="form-label">Employee ID</label>
        <input
            type="text"
            class="form-control"
            value="{{ employee.emp_id }}"
            readonly
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Employee Name</label>
        <input
            type="text"
            name="name"
            class="form-control"
            value="{{ employee.name }}"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Department</label>
        <input
            type="text"
            name="department"
            class="form-control"
            value="{{ employee.department }}"
            required
        >
    </div>

    <div class="mb-3">
        <label class="form-label">Email</label>
        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ employee.email }}"
            required
        >
    </div>

    <button type="submit" class="btn btn-primary">
        Update Employee
    </button>

    <a href="/employees" class="btn btn-secondary">
        Cancel
    </a>

</form>

{% endblock %}
